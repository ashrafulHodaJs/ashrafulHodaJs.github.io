        filter="url(#shadow)"/>

  <text x="64" y="78"
        text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="42"
        letter-spacing="4"
        fill="#3d6f9f"
        font-weight="500">
    AH
