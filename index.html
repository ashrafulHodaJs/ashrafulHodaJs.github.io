<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ashraful Hoda</title>
 <link rel="icon" type="image/svg+xml" href="/AH_favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400&family=Oxanium:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #c8e8f8 0%, #ddf0fb 35%, #b8d9f0 70%, #a2cce8 100%);
    z-index: 0;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .b1 { width: 420px; height: 300px; background: #ffffff; top: -60px; left: -80px; }
  .b2 { width: 340px; height: 260px; background: #e0f4ff; bottom: -40px; right: -60px; }
  .b3 { width: 240px; height: 180px; background: #c5e8ff; top: 40%; left: 60%; }

  .card {
    position: relative; z-index: 1;
    width: min(420px, 90vw);
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 24px;
    padding: 2.6rem 2.8rem;
    text-align: center;
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow:
      0 8px 32px rgba(100,160,220,0.18),
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -1px 0 rgba(100,180,240,0.12) inset;
    animation: rise 1s cubic-bezier(.22,.8,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(160,200,240,0.5);
    border-radius: 100px;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5d96c4;
    margin-bottom: 1.8rem;
  }
  .pill-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #7ac0ea;
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .name {
    font-family: 'Oxanium', sans-serif;
    font-weight: 300;
    font-size: clamp(1.7rem, 6vw, 2.3rem);
    letter-spacing: 0.06em;
    color: #1a4a70;
    margin-bottom: 0.35rem;
  }

  .sub {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7aabcf;
    margin-bottom: 2rem;
  }

  .divider {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, #90c4e4, transparent);
    margin: 0 auto 2rem;
  }

  /* ── progress game ── */
  .game-label {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7aabcf;
    margin-bottom: 0.7rem;
  }

  .progress-wrap {
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(160,210,240,0.45);
    border-radius: 100px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 0.6rem;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, #7dd3f8, #4ab4f0, #a8e0ff);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
    transition: width 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }

  .progress-status {
    font-size: 0.75rem;
    color: #5d96c4;
    min-height: 1.1rem;
    margin-bottom: 1rem;
    transition: opacity 0.3s;
  }

  .click-btn {
    display: inline-block;
    padding: 0.45rem 1.4rem;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(140,200,240,0.55);
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: #2e7ab0;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    user-select: none;
  }
  .click-btn:hover { background: rgba(255,255,255,0.85); }
  .click-btn:active { transform: scale(0.96); }

  /* ── socials ── */
  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 2rem;
    padding-top: 1.6rem;
    border-top: 1px solid rgba(160,210,240,0.3);
  }

  .social-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0.45rem 1.2rem;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(160,210,240,0.5);
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #2e7ab0;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .social-btn:hover {
    background: rgba(255,255,255,0.85);
    box-shadow: 0 4px 16px rgba(100,170,230,0.18);
    transform: translateY(-1px);
  }
  .social-btn svg {
    width: 15px; height: 15px;
    fill: currentColor;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="card">
  <div class="pill"><span class="pill-dot"></span> under construction</div>
  <h1 class="name">Ashraful Hoda</h1>
  <p class="sub">Coming soon</p>
  <div class="divider"></div>

  <p class="game-label">Website build progress</p>
  <div class="progress-wrap">
    <div class="progress-fill" id="fill" style="width: 12%"></div>
  </div>
  <p class="progress-status" id="status">Every click helps… maybe.</p>
  <button class="click-btn" id="btn" onclick="advance()">Help build it ✦</button>

  <div class="socials">
    <a class="social-btn" href="https://github.com/ashrafulHodaJs" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.31 3.435 9.818 8.205 11.408.6.11.82-.26.82-.577v-2.02c-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.382 1.236-3.22-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.3 1.23A11.51 11.51 0 0 1 12 6.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.655 1.652.243 2.873.12 3.176.77.838 1.235 1.91 1.235 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222v3.293c0 .32.218.694.825.576C20.568 22.315 24 17.807 24 12.5 24 5.87 18.627.5 12 .5z"/></svg>
      GitHub
    </a>
    <a class="social-btn" href="https://www.linkedin.com/in/ashraful-hoda-3393a3287/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      LinkedIn
    </a>
  </div>
</div>

<script>
  const messages = [
    "Every click helps… maybe.",
    "Ooh, that did something.",
    "Progress! Kind of.",
    "Okay okay, we're moving.",
    "The CSS is writing itself…",
    "Almost got the navbar working.",
    "Someone tripped over the server cable.",
    "Back at it. Almost.",
    "Looking good actually.",
    "97%… sooo close.",
    "The website is shy. It'll come out when it's ready.",
    "Still 97%. This is fine. ✦"
  ];

  let pct = 12;
  let clicks = 0;
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');

  function advance() {
    if (pct >= 97) {
      status.textContent = messages[messages.length - 1];
      btn.textContent = "It's done when it's done ✦";
      return;
    }
    const jump = clicks < 5
      ? Math.random() * 10 + 6
      : clicks < 9
      ? Math.random() * 5 + 2
      : Math.random() * 1.5 + 0.2;

    pct = Math.min(97, pct + jump);
    fill.style.width = pct.toFixed(1) + '%';

    const idx = Math.min(clicks, messages.length - 2);
    status.textContent = messages[idx];
    clicks++;

    if (pct >= 97) {
      btn.textContent = "It's done when it's done ✦";
      status.textContent = messages[messages.length - 1];
    }
  }
</script>
</body>
</html>
